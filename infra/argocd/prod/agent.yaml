# ArgoCD Application: agent (prod)
# Manual sync: ArgoCD polls the main branch and marks this Application
# OutOfSync when it detects a change under infra/k8s/prod/agent/, but does
# NOT deploy automatically. Deploy with: argocd app sync agent-prod
# (or click Sync in the UI) after reviewing the diff.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Talalhussien/PolyAI.git
    targetRevision: main
    path: infra/k8s/prod/agent
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  # No syncPolicy.automated - prod deploys are always manual, per design.
