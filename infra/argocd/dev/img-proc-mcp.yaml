# ArgoCD Application: img-proc-mcp (dev)
# Auto-sync: ArgoCD polls the dev branch (default 3-minute interval, or
# immediately with a webhook) and deploys automatically once it detects a
# change under infra/k8s/dev/img-proc-mcp/. prune+selfHeal keep the live namespace
# matching git exactly, including reverting manual kubectl edits.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: img-proc-mcp-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Talalhussien/PolyAI.git
    targetRevision: dev
    path: infra/k8s/dev/img-proc-mcp
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
