# Apply: kubectl apply -R -f infra/k8s/prod
# Targets use k8s Service DNS names (yolo-svc/agent-svc), not the Compose
# container names (yolo/agent) used in monitoring/prometheus.yml locally.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: prod
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      - job_name: 'yolo-service'
        static_configs:
          - targets: ['yolo-svc:8080']
        metrics_path: /metrics

      - job_name: 'agent-service'
        static_configs:
          - targets: ['agent-svc:8000']
        metrics_path: /metrics
