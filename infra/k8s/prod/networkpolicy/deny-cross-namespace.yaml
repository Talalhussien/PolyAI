# NEW FILE — mirror of infra/k8s/dev/networkpolicy/deny-cross-namespace.yaml,
# for the "prod" namespace. See that file's header comment for the full
# rationale. Both policies are needed together: this one blocks dev->prod
# connections (enforced on prod's side, since ingress policy is enforced by
# the receiving pod's namespace); the dev one blocks prod->dev the same way.
#
# Apply: kubectl apply -f infra/k8s/prod/networkpolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-other-namespaces
  namespace: prod
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
