# Apply: kubectl apply -R -f infra/k8s/prod
# Statically provisioned: binds to the pre-existing PV in ../pv/prometheus-pv.yaml,
# which points (via volumeHandle) at the Terraform-managed EBS volume
# aws_ebs_volume.prometheus_prod. Not dynamic — the CSI driver attaches an
# already-existing volume here, it doesn't create a new one.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-pvc
  namespace: prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  resources:
    requests:
      storage: 5Gi
