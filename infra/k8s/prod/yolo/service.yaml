# Apply: kubectl apply -R -f infra/k8s/prod
apiVersion: v1
kind: Service
metadata:
  name: yolo-svc
  namespace: prod
  labels:
    app: yolo
spec:
  selector:
    app: yolo   # must exactly match the Deployment's Pod-template labels
  ports:
    - protocol: TCP
      name: http
      port: 8080
      targetPort: 8080
