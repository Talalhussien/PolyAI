# Apply: kubectl apply -R -f infra/k8s/prod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: prod
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana
        ports:
        - containerPort: 3000
        env:
        - name: GF_AUTH_BASIC_ENABLED
          value: "true"
        - name: GF_SECURITY_ADMIN_USER
          value: "admin"
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "changeme123"   # move to a Secret before using this outside of learning/dev
        # Prometheus datasource is not auto-provisioned here (no ConfigMap
        # mount) — add it manually in the UI at http://prometheus-svc:9090
        # after the Pod is running, or add a datasource-provisioning ConfigMap.
