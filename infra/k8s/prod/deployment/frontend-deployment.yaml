# Apply: kubectl apply -R -f infra/k8s/prod
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prod
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: talalhussien/frontend-service:0.0.3
        ports:
        - containerPort: 3000
        # No runtime env vars — NEXT_PUBLIC_AGENT_URL is baked in at image BUILD
        # time via a Next.js build ARG, not configurable from this Deployment.
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "300m"
            memory: "256Mi"
        # The frontend Dockerfile has no HEALTHCHECK / health endpoint today, so
        # a TCP probe is used instead of an HTTP one.
        livenessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          tcpSocket:
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
