# Apply: kubectl apply -R -f infra/k8s/prod
# Same "changeme123" placeholder the old plaintext env var used — change this
# to a real value before using Grafana outside of learning/dev, and prefer
# `kubectl create secret generic --from-literal` (not committed to git) over
# editing this file directly once it's a real password.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: prod
type: Opaque
stringData:
  admin-password: "changeme123"
