apiVersion: v1
kind: ConfigMap
metadata:
  name: polyai-overview-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  polyai-overview.json: |
    {
      "title": "PolyAI Overview",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP requests per second",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {"expr": "sum by (job) (rate(http_requests_total{namespace=~\"dev|prod\"}[5m]))", "refId": "A"}
          ]
        },
        {
          "type": "timeseries",
          "title": "Unavailable replicas",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {"expr": "kube_deployment_status_replicas_unavailable{namespace=~\"dev|prod\"}", "refId": "A"}
          ]
        }
      ]
    }
