# Volume is Terraform-managed: infra/tf/modules/k8s-cluster/main.tf
# resource "aws_ebs_volume" "prometheus_dev" (us-east-1b, 5Gi, gp3).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv-dev
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-0859a55edb454087d
    fsType: ext4
