apiVersion: v1
kind: PersistentVolume
metadata:
  name: prometheus-pv-dev
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-sc
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: ebs.csi.aws.com
    volumeHandle: vol-0ea376b7800407535
    fsType: ext4
