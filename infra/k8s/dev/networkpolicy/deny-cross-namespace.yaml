# NEW FILE — dev/prod pod isolation.
#
# Why this exists: infra/tf/env-networking.tf adds reserved dev/prod
# subnets, but dev and prod pods still run on the SAME single worker node
# today (one shared cluster, one worker ASG) — AWS-level VPC constructs
# (subnets, NACLs, security groups) can't distinguish traffic by Kubernetes
# namespace when it's all on one node's network interface. This
# NetworkPolicy is the actual isolation mechanism: enforced by Calico (the
# cluster's CNI), it operates per-pod/per-namespace regardless of which
# node or subnet the pods happen to land on.
#
# Apply: kubectl apply -f infra/k8s/dev/networkpolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-from-other-namespaces
  namespace: dev
spec:
  # Empty podSelector = applies to every pod in this namespace, not just
  # some of them.
  podSelector: {}
  # Ingress only — this restricts who may open a connection INTO dev pods.
  # Egress is untouched, so dev pods can still reach CoreDNS in kube-system
  # (DNS resolution keeps working), the internet (S3, Bedrock), etc.
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Only allow senders that are themselves in this same namespace
        # (an empty podSelector here means "any pod," but only within the
        # namespace this NetworkPolicy is scoped to). A pod in "prod" is a
        # different namespace, so its connection attempts are dropped here.
        - podSelector: {}
