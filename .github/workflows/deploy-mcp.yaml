name: Deploy Image-Processing MCP

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/img-proc-mcp/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: services/img-proc-mcp
          push: true
          tags: talalhussien/img-proc-mcp:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref == 'refs/heads/main' && 'prod.talal.fursa.click' || 'dev.talal.fursa.click' }}
          username: ubuntu
          key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd /opt/PolyAI
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            sed -i "s/^MCP_TAG=.*/MCP_TAG=${{ github.sha }}/" .env
            docker compose pull img-proc-mcp
            docker compose up -d img-proc-mcp
            docker compose ps
