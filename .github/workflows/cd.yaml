name: Build and Deploy Changed Services

on:
  push:
    branches: [dev, main]
   
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false # serialize runs on the same branch so two pushes can't race on the commit

permissions:
  contents: write
  pull-requests: write # needed to open the prod PR (main is PR-protected; see the prod branch below)

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # First push to this branch — no prior commit to diff against;
            # use the empty tree as the base so every existing service is
            # considered (safe default for a branch's first-ever push).
            BEFORE=$(git hash-object -t tree /dev/null)
          fi

          CHANGED_DIRS=$(git diff --name-only "$BEFORE" "$AFTER" -- services/ | cut -d/ -f2 | sort -u)

          MATRIX="[]"
          for svc in yolo agent frontend img-proc-mcp; do
            if echo "$CHANGED_DIRS" | grep -qx "$svc"; then
              MATRIX=$(echo "$MATRIX" | jq -c --arg s "$svc" '. + [$s]')
            fi
          done
          echo "services=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Changed services: $MATRIX"

  build-and-deploy:
    needs: detect
    if: needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
      fail-fast: false
      max-parallel: 1 # sequential: each job commits+pushes to the same branch, avoids a git push race
    env:
      ENV: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # always push against the branch tip, in case a prior matrix job already advanced it

      - name: Map service to image name
        id: image
        run: |
          declare -A MAP=( [yolo]=yolo-service [agent]=agent-service [frontend]=frontend-service [img-proc-mcp]=img-proc-mcp )
          echo "name=${MAP[${{ matrix.service }}]}" >> "$GITHUB_OUTPUT"

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: talalhussien/${{ steps.image.outputs.name }}:${{ steps.tag.outputs.tag }}

      - name: Update manifest and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILE="infra/k8s/${ENV}/${{ matrix.service }}/deployment.yaml"
          sed -i -E "s|(image: talalhussien/${{ steps.image.outputs.name }}:).*|\1${{ steps.tag.outputs.tag }}|" "$FILE"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${{ github.ref_name }}" = "dev" ]; then
            # dev has no branch protection -- direct push is correct here,
            # and matches "dev remains automatic": ArgoCD's dev Applications
            # pick this commit up on their own with no human step at all.
            git pull --ff-only origin dev
            git add "$FILE"
            git commit -m "cd: bump ${{ matrix.service }} (dev) to ${{ steps.tag.outputs.tag }} [skip ci]"
            git push origin dev
          else
            # main requires a PR (repository ruleset: "Changes must be made
            # through a pull request", confirmed live -- a direct push here
            # is rejected). Not routed around with a PAT/auto-merge: prod is
            # already meant to be a manual, human-gated path end to end (its
            # ArgoCD Applications require manual sync by design), so a
            # human reviewing and merging this PR is a second, consistent
            # checkpoint on the same path, not a workaround.
            BRANCH="cd/${{ matrix.service }}-${{ steps.tag.outputs.tag }}"
            git checkout -b "$BRANCH"
            git add "$FILE"
            git commit -m "cd: bump ${{ matrix.service }} (prod) to ${{ steps.tag.outputs.tag }}"
            git push origin "$BRANCH"
            gh pr create --base main --head "$BRANCH" \
              --title "cd: bump ${{ matrix.service }} (prod) to ${{ steps.tag.outputs.tag }}" \
              --body "Automated image tag bump for \`${{ matrix.service }}\`. Merge to let ArgoCD's \`${{ matrix.service }}-prod\` Application see the change (it still requires a manual \`argocd app sync\` after merge -- this PR only updates what git/ArgoCD compare against)."
          fi
