name: Deploy Frontend

on:
  push:
    branches: [dev, main]
    paths:
      - 'services/frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pick agent URL for this branch
        id: agent-url
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "url=http://prod.talal.fursa.click:8000" >> "$GITHUB_OUTPUT"
          else
            echo "url=http://dev.talal.fursa.click:8000" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v5
        with:
          context: services/frontend
          push: true
          tags: talalhussien/frontend-service:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_AGENT_URL=${{ steps.agent-url.outputs.url }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ github.ref == 'refs/heads/main' && 'prod.talal.fursa.click' || 'dev.talal.fursa.click' }}
          username: ubuntu
          key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_INSTANCE_SSH_KEY || secrets.DEV_INSTANCE_SSH_KEY }}
          script: |
            set -e
            cd /opt/PolyAI
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            sed -i "s/^FRONTEND_TAG=.*/FRONTEND_TAG=${{ github.sha }}/" .env
            docker compose pull frontend
            docker compose up -d frontend
            docker compose ps
