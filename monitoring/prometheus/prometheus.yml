global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node-exporter
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: agent
    static_configs:
      - targets: ['agent:8000']
    metrics_path: /metrics

  - job_name: yolo
    static_configs:
      - targets: ['yolo:8080']
    metrics_path: /metrics
